[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-hazard-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "uvicorn>=0.32,<1",
  "pymongo>=4.10,<5",
  "httpx>=0.27,<1",
  "tzdata>=2025.1",
  "numpy>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "mongomock>=4.3,<5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
